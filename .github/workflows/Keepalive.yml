name: Keep Alive

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive via API
        run: |
          curl -s -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows"
